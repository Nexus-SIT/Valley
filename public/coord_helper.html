<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coordinate Helper</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      display: flex;
    }
    #map-container {
      position: relative;
      width: 2000px;
      height: 2000px;
      border: 2px solid red;
    }
    #map-img {
      width: 2000px;
      height: 2000px;
      display: block;
    }
    #sidebar {
      position: fixed;
      right: 0;
      top: 0;
      width: 400px;
      height: 100vh;
      background: #222;
      border-left: 2px solid #444;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 1000;
    }
    .dot {
      position: absolute;
      width: 10px;
      height: 10px;
      background: cyan;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    pre {
      background: #000;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }
    button {
      padding: 10px 20px;
      background: cyan;
      color: #000;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div id="map-container">
    <img id="map-img" src="/campus_map.png" alt="Campus Map">
  </div>
  <div id="sidebar">
    <h2>Map Coordinates Helper</h2>
    <p>Click anywhere on the map to get coordinates (0-2000 scale).</p>
    <button onclick="clearCoords()">Clear</button>
    <h3>Click History</h3>
    <pre id="output">[]</pre>
  </div>

  <script>
    const coords = [];
    const container = document.getElementById('map-container');
    const output = document.getElementById('output');

    container.addEventListener('click', (e) => {
      const rect = container.getBoundingClientRect();
      const x = Math.round(((e.clientX - rect.left) / rect.width) * 2000);
      const y = Math.round(((e.clientY - rect.top) / rect.height) * 2000);

      coords.push({ x, y });
      output.textContent = JSON.stringify(coords, null, 2);

      // Create a visual dot
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.left = `${(x / 2000) * 100}%`;
      dot.style.top = `${(y / 2000) * 100}%`;
      container.appendChild(dot);
    });

    function clearCoords() {
      coords.length = 0;
      output.textContent = '[]';
      const dots = document.querySelectorAll('.dot');
      dots.forEach(d => d.remove());
    }
  </script>
</body>
</html>
